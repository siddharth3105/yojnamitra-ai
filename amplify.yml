version: 1
frontend:
  phases:
    preBuild:
      commands:
        - yum install -y python3 python3-pip
        - pip3 install --upgrade pip
        - pip3 install -r requirements.txt
    build:
      commands:
        - echo "Streamlit app configured for AWS Amplify"
        - chmod +x start.sh
  artifacts:
    baseDirectory: /
    files:
      - '**/*'
  cache:
    paths:
      - '/root/.cache/pip/**/*'
